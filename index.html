<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RUkaBord — Технические работы</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #060d1a;
            color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }
        .container {
            max-width: 600px;
            padding: 20px;
            z-index: 2;
        }
        h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            color: #ffd000;
            text-shadow: 0 0 20px rgba(255, 208, 0, 0.5);
            letter-spacing: 2px;
        }
        p {
            font-size: 1.2rem;
            color: #8da2fb;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .badge {
            background: linear-gradient(135deg, #ffd000, #ff6a00, #b80053, #6e001c);
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(255, 106, 0, 0.4);
        }
        .footer {
            font-size: 0.9rem;
            color: #4f5b73;
            margin-top: 50px;
        }
        /* Анимация падающих звезд на фоне */
        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: pulse 2s infinite ease-in-out;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Задний фон со звездами -->
    <div class="star" style="top: 20%; left: 10%; width: 2px; height: 2px;"></div>
    <div class="star" style="top: 50%; left: 80%; width: 3px; height: 3px; animation-delay: 0.5s;"></div>
    <div class="star" style="top: 80%; left: 30%; width: 2px; height: 2px; animation-delay: 1s;"></div>
    <div class="star" style="top: 15%; left: 70%; width: 3px; height: 3px; animation-delay: 1.5s;"></div>

    <div class="container">
        <div class="badge">v0.14.5 LOADING</div>
        <h1>RUkaBord</h1>
        <p>Платформа временно ушла на техническое обслуживание. Закрываем баги безопасности, настраиваем генерацию ID пользователей и готовим базу данных для первой сотни тестеров.</p>
        <p style="color: #ffd000; font-style: italic;">«Look up at the stars, not down at your feet» 🌌</p>
        <div class="footer">Открытие в тесении недели. It's about people.</div>
    </div>

</body>
</html>
